  </text>

  <rect x="70" y="185" width="980" height="970" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="70" y="185" width="980" height="116" rx="26" fill="#1f3d5a"/>
  <text x="120" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">
