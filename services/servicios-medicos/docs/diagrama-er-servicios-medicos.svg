  <text x="760" y="800" font-family="Consolas, monospace" font-size="22" fill="#1f2937">varchar(32)</text>

  <text x="120" y="846" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="846" font-family="Consolas, monospace" font-size="22" fill="#1f2937">is_active</text>
  <text x="760" y="846" font-family="Consolas, monospace" font-size="22" fill="#1f2937">boolean</text>

  <text x="120" y="892" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="892" font-family="Consolas, monospace" font-size="22" fill="#1f2937">duration_minutes</text>
  <text x="760" y="892" font-family="Consolas, monospace" font-size="22" fill="#1f2937">integer</text>

  <text x="120" y="938" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="938" font-family="Consolas, monospace" font-size="22" fill="#1f2937">preparation_requirements</text>
  <text x="760" y="938" font-family="Consolas, monospace" font-size="22" fill="#1f2937">text[]</text>

  <text x="120" y="984" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="984" font-family="Consolas, monospace" font-size="22" fill="#1f2937">specialty_ids</text>
  <text x="760" y="984" font-family="Consolas, monospace" font-size="22" fill="#1f2937">text[]</text>

  <text x="120" y="1030" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="1030" font-family="Consolas, monospace" font-size="22" fill="#1f2937">tags</text>
  <text x="760" y="1030" font-family="Consolas, monospace" font-size="22" fill="#1f2937">text[]</text>

  <text x="120" y="1076" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="1076" font-family="Consolas, monospace" font-size="22" fill="#1f2937">created_at</text>
  <text x="760" y="1076" font-family="Consolas, monospace" font-size="22" fill="#1f2937">timestamptz</text>

  <text x="120" y="1122" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="1122" font-family="Consolas, monospace" font-size="22" fill="#1f2937">updated_at</text>
  <text x="760" y="1122" font-family="Consolas, monospace" font-size="22" fill="#1f2937">timestamptz</text>

  <rect x="1090" y="185" width="430" height="230" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="1090" y="185" width="430" height="82" rx="24" fill="#b9771f"/>
  <text x="1130" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
    Restricciones
  </text>
  <text x="1130" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#233042">- PK sobre id</text>
  <text x="1130" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#233042">- UNIQUE sobre code</text>
  <text x="1130" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#233042">- Creacion automatica de tabla</text>

  <rect x="1090" y="455" width="430" height="230" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="1090" y="455" width="430" height="82" rx="24" fill="#2f7d69"/>
  <text x="1130" y="508" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
    Persistencia
  </text>
  <text x="1130" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#233042">- Desarrollo local en memoria</text>
  <text x="1130" y="635" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#233042">- Despliegue final con DB externa</text>
  <text x="1130" y="680" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#233042">- La base vive fuera del servicio</text>

  <rect x="1090" y="725" width="430" height="230" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="1090" y="725" width="430" height="82" rx="24" fill="#4a46d8"/>
  <text x="1130" y="778" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">
