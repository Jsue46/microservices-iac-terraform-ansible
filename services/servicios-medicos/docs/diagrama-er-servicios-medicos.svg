  </text>
  <text x="120" y="290" font-family="Consolas, monospace" font-size="26" fill="#d8e3ee">
    medical_services
  </text>

  <line x1="110" y1="350" x2="1010" y2="350" stroke="#d5dee8" stroke-width="2"/>

  <text x="120" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b3147">Clave</text>
  <text x="265" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b3147">Campo</text>
  <text x="760" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1b3147">Tipo</text>
  <line x1="110" y1="425" x2="1010" y2="425" stroke="#d5dee8" stroke-width="2"/>

  <text x="120" y="478" font-family="Consolas, monospace" font-size="22" fill="#166534">PK</text>
  <text x="265" y="478" font-family="Consolas, monospace" font-size="22" fill="#1f2937">id</text>
  <text x="760" y="478" font-family="Consolas, monospace" font-size="22" fill="#1f2937">varchar(32)</text>

  <text x="120" y="524" font-family="Consolas, monospace" font-size="22" fill="#c2410c">UQ</text>
  <text x="265" y="524" font-family="Consolas, monospace" font-size="22" fill="#1f2937">code</text>
  <text x="760" y="524" font-family="Consolas, monospace" font-size="22" fill="#1f2937">varchar(128)</text>

  <text x="120" y="570" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="570" font-family="Consolas, monospace" font-size="22" fill="#1f2937">name</text>
  <text x="760" y="570" font-family="Consolas, monospace" font-size="22" fill="#1f2937">varchar(255)</text>

  <text x="120" y="616" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="616" font-family="Consolas, monospace" font-size="22" fill="#1f2937">short_description</text>
  <text x="760" y="616" font-family="Consolas, monospace" font-size="22" fill="#1f2937">text</text>

  <text x="120" y="662" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="662" font-family="Consolas, monospace" font-size="22" fill="#1f2937">technical_description</text>
  <text x="760" y="662" font-family="Consolas, monospace" font-size="22" fill="#1f2937">text</text>

  <text x="120" y="708" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
  <text x="265" y="708" font-family="Consolas, monospace" font-size="22" fill="#1f2937">price</text>
  <text x="760" y="708" font-family="Consolas, monospace" font-size="22" fill="#1f2937">numeric(10,2)</text>

  <text x="120" y="754" font-family="Consolas, monospace" font-size="22" fill="#64748b">-</text>
