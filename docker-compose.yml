services:
  servicios-medicos:
    build:
      context: ./services/servicios-medicos
    container_name: servicios-medicos
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      SERVICE_NAME: servicios-medicos
      API_PREFIX: /api/v1
      PERSISTENCE_MODE: memory
    expose:
      - "3001"

  especialidades:
    build:
      context: ./services/especialidades
    container_name: especialidades
    environment:
      PORT: 3002
      HOST: 0.0.0.0
      SERVICE_NAME: especialidades
      API_PREFIX: /api/v1
    expose:
      - "3002"

  gateway:
    build:
      context: ./gateway
    container_name: gateway
    environment:
      MEDICAL_SERVICE_HOST: servicios-medicos
      MEDICAL_SERVICE_PORT: 3001
      SPECIALTY_SERVICE_HOST: especialidades
      SPECIALTY_SERVICE_PORT: 3002
    depends_on:
      - servicios-medicos
      - especialidades
    ports:
      - "8080:80"

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    environment:
      GATEWAY_HOST: gateway
      GATEWAY_PORT: 80
    depends_on:
      - gateway
    ports:
      - "80:80"
