---
- name: Base setup (Docker)
  hosts: all
  become: true
  tasks:
    - name: Install Docker packages
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: true

    - name: Enable Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Create deployment folders
      file:
        path: "/opt/ayd2/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - compose
        - env

- name: Deploy frontend
  hosts: frontend
  become: true
  tasks:
    - name: Copy env file
      copy:
        src: "{{ playbook_dir }}/../../frontend/.env"
        dest: /opt/ayd2/env/frontend.env
        mode: "0644"

    - name: Copy compose file
      copy:
        src: "{{ playbook_dir }}/compose-frontend.yml"
        dest: /opt/ayd2/compose/compose-frontend.yml
        mode: "0644"

    - name: Pull image
      command: docker-compose -f /opt/ayd2/compose/compose-frontend.yml pull

    - name: Compose up
      command: docker-compose -f /opt/ayd2/compose/compose-frontend.yml up -d

