worker_processes 1;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;

	upstream medical_service {
		server servicios-medicos:3001;
	}

	upstream specialty_service {
		server especialidades:3002;
	}

	server {
		listen 80;
		server_name _;

		# Health del gateway
		location = /health {
			add_header Content-Type application/json;
			return 200 '{"success":true,"data":{"service":"gateway","status":"ok"}}';
		}

		# Health del microservicio de servicios medicos
		location = /health/servicios-medicos {
			proxy_pass http://medical_service/health;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Health del microservicio de especialidades
		location = /health/especialidades {
			proxy_pass http://specialty_service/health;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# Rutas del microservicio de servicios medicos
		location ^~ /api/v1/medical-services {
			proxy_pass http://medical_service;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Content-Type $content_type;
			proxy_read_timeout 60s;
		}

		# Rutas del microservicio de especialidades
		location ^~ /api/v1/especialidades {
			proxy_pass http://specialty_service;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Content-Type $content_type;
			proxy_read_timeout 60s;
		}

		location / {
			return 404;
		}
	}
}
