server {
	listen 80;
	server_name _;

	location = /health {
		add_header Content-Type application/json;
		return 200 '{"success":true,"data":{"service":"gateway","status":"ok"}}';
	}

	location = /health/servicios-medicos {
		proxy_pass http://${MEDICAL_SERVICE_HOST}:${MEDICAL_SERVICE_PORT}/health;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /health/especialidades {
		proxy_pass http://${SPECIALTY_SERVICE_HOST}:${SPECIALTY_SERVICE_PORT}/health;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ^~ /api/v1/medical-services {
		proxy_pass http://${MEDICAL_SERVICE_HOST}:${MEDICAL_SERVICE_PORT};
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Content-Type $content_type;
		proxy_read_timeout 60s;
	}

	location ^~ /api/v1/especialidades {
		proxy_pass http://${SPECIALTY_SERVICE_HOST}:${SPECIALTY_SERVICE_PORT};
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Content-Type $content_type;
		proxy_read_timeout 60s;
	}

	location / {
		return 404;
	}
}
